name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .
      - name: Generate examples
        run: python examples/make_examples.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke tests
        shell: bash
        run: |
          bytelens --version
          bytelens analyze examples/sample.png --json
          bytelens structures examples/sample.zip
          bytelens entropy examples/packed.bin
          bytelens strings examples/script.sh
          bytelens compare examples/sample.png examples/sample.zip --json
